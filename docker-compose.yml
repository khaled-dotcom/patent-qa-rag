# Run on any server:  GROQ_API_KEY=... docker compose up -d   ->  http://<server>:8000
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - RAG_API_KEY=${RAG_API_KEY:-}
    restart: unless-stopped
