# Render Blueprint: one free web service built from the Dockerfile.
services:
  - type: web
    name: patent-qa-rag
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false        # Render asks you for it when you deploy
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: RAG_API_KEY   # optional: leave empty for an open API
        sync: false
